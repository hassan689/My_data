{% load static %}

<nav class="bg-white border-gray-200 fixed w-full z-20 top-0 start-0">
  <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
    <a href="{% url 'main:index' %}" class="flex items-center space-x-3 rtl:space-x-reverse">
			<span class="self-center text-2xl font-bold whitespace-nowrap text-gray-900 italic">
					Dispatch Skool
			</span>
		</a>
	
    <button data-collapse-toggle="navbar-default" type="button" class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-500 rounded-lg md:hidden hover:bg-gray-100 focus:outline-none focus:ring-2 focus:ring-gray-200" aria-controls="navbar-default" aria-expanded="false">
        <span class="sr-only">Open main menu</span>
        <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
            <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15"/>
        </svg>
    </button>
    <div class="hidden w-full md:block md:w-auto" id="navbar-default">
      <ul class="flex flex-col font-medium p-4 md:p-0 mt-4 border rounded-lg md:space-x-6 md:flex-row md:mt-0 md:border-0">
        <li>
          <a href="#how-it-works" class="block py-2 px-3 md:p-0 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-gray-700">How it Works</a>
        </li>
        <li>
          <a href="#pricing" class="block py-2 px-3 md:p-0 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-gray-700">Pricing</a>
        </li>
        <li>
          <a href="#contact" class="block py-2 px-3 md:p-0 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-gray-700">Contact</a>
        </li>
				{% if not request.user.is_authenticated %}
        <li>
          <a href="{% url 'users:login' %}" class="block py-2 px-3 md:p-0 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-gray-700">Login</a>
        </li>
        <li>
          <a href="{% url 'users:signup' %}" class="text-white bg-gray-900 hover:bg-gray-800 font-medium rounded-lg text-sm my-5 sm:my-0 px-4 py-2 text-center">
						Get started
					</a>
        </li>
				{% else %}
					<li>
						<form method="post" action="{% url 'users:logout' %}">
								{% csrf_token %}
								<button type="submit" class="block py-2 px-3 md:p-0 text-gray-900 rounded-sm hover:bg-gray-100 md:hover:bg-transparent md:hover:text-gray-700">
										Logout
								</button>
						</form>
					</li>
          {% if request.user.affiliate_profile %}
              <li>
                <a href="{% url 'affiliates:affiliate_dshbrd' aff_name=request.user.affiliate_profile.name aff_id=request.user.affiliate_profile.id  %}" 
                  class="text-white bg-gray-900 hover:bg-gray-800 font-medium rounded-lg text-sm my-5 sm:my-0 px-4 py-2 text-center">
                    <i class="fa-solid fa-users text-whie"></i>
                    <span class="ms-3">Affiliates</span>
                </a>
              </li>
          {% endif %}
					<li>
						<a href="{% url 'dashboard:index' %}" class="text-white bg-gray-900 hover:bg-gray-800 font-medium rounded-lg text-sm my-5 sm:my-0 px-4 py-2 text-center">
							Dashboard
						</a>
					</li>
				{% endif %}
      </ul>
    </div>
  </div>
</nav>
